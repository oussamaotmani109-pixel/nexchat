<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexChat | الدردشة الأسطورية</title>
    <!-- استيراد خط متمم وجميل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* المتغيرات الافتراضية للوضع الداكن */
        :root {
            --bg-body: #0b0f19;
            --bg-container: #111827;
            --header-bg: #1f2937;
            --border-color: #374151;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #111827;
            --bubble-incoming: #1f2937;
            --badge-bg: #374151;
            --badge-hover: #4b5563;
            --badge-text: #d1d5db;
            --chat-gradient: radial-gradient(circle at center, #111827 0%, #0b0f19 100%);
        }

        /* متغيرات الوضع النهاري */
        body.light-mode {
            --bg-body: #f0f2f5;
            --bg-container: #ffffff;
            --header-bg: #ffffff;
            --border-color: #e5e7eb;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --input-bg: #f9fafb;
            --bubble-incoming: #e5e7eb;
            --badge-bg: #f3f4f6;
            --badge-hover: #e5e7eb;
            --badge-text: #374151;
            --chat-gradient: radial-gradient(circle at center, #ffffff 0%, #f0f2f5 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background: var(--bg-container);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            position: relative;
            transition: background 0.3s ease;
        }

        @media (min-width: 481px) {
            .app-container {
                height: 90vh;
                border-radius: 20px;
                border: 1px solid var(--border-color);
            }
        }

        #auth-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-container);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
            transition: opacity 0.3s ease, background 0.3s ease;
        }

        .auth-card {
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .auth-card h2 {
            font-size: 26px;
            font-weight: 900;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .auth-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
            transition: border-color 0.2s, background 0.3s, color 0.3s;
            user-select: text;
        }

        .auth-input:focus {
            border-color: #38bdf8;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: transform 0.1s;
        }

        .auth-btn:active {
            transform: scale(0.98);
        }

        header {
            padding: 15px 20px;
            background: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .room-avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
        }

        .room-details h1 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
            transition: color 0.2s;
        }

        .room-info:hover .room-details h1 {
            color: #38bdf8;
        }

        .room-details span {
            font-size: 12px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .room-details span::before {
            content: '';
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-badge {
            background: var(--badge-bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--badge-text);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .user-badge:hover {
            background: var(--badge-hover);
        }

        .theme-toggle-btn {
            background: var(--badge-bg);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--badge-text);
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.1s;
        }

        .theme-toggle-btn:hover {
            background: var(--badge-hover);
        }

        .theme-toggle-btn:active {
            transform: scale(0.92);
        }

        .custom-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .custom-modal.active {
            display: flex;
            animation: fadeInOverlay 0.2s ease;
        }

        .modal-card {
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .modal-card h3 {
            font-size: 20px;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .modal-card p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-btn-cancel {
            flex: 1;
            padding: 10px;
            background: var(--badge-bg);
            border: none;
            border-radius: 10px;
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn-save {
            flex: 1;
            padding: 10px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--chat-gradient);
            transition: background 0.3s ease;
        }

        .message-container {
            max-width: 80%;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.2s ease;
            position: relative;
            transition: transform 0.2s ease;
        }

        .message-container.incoming {
            align-self: flex-start;
        }

        .message-container.outgoing {
            align-self: flex-end;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-sender {
            font-size: 10px;
            font-weight: 600;
            margin-bottom: 2px;
            color: #0284c7;
            padding: 0 4px;
        }

        body:not(.light-mode) .msg-sender {
            color: #38bdf8;
        }

        .message-container.outgoing .msg-sender {
            color: #2563eb;
            text-align: left;
        }

        body:not(.light-mode) .message-container.outgoing .msg-sender {
            color: #93c5fd;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            position: relative;
            word-wrap: break-word;
            -webkit-user-select: none;
            user-select: none;
            cursor: pointer;
        }

        .message-container.incoming .message-bubble {
            background: var(--bubble-incoming);
            border-bottom-left-radius: 4px;
            color: var(--text-color);
        }

        .message-container.outgoing .message-bubble {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border-bottom-right-radius: 4px;
            color: white;
        }

        .reply-preview-box {
            background: rgba(0, 0, 0, 0.08);
            border-right: 3px solid #0284c7;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 12px;
        }

        body:not(.light-mode) .reply-preview-box {
            background: rgba(0, 0, 0, 0.2);
            border-right-color: #38bdf8;
        }

        .reply-preview-sender {
            font-weight: 700;
            color: #0284c7;
            margin-bottom: 2px;
        }

        body:not(.light-mode) .reply-preview-sender {
            color: #38bdf8;
        }

        .message-container.outgoing .reply-preview-box {
            border-right-color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.1);
        }
        .message-container.outgoing .reply-preview-sender {
            color: #e0f2fe;
        }

        .msg-text {
            font-size: 14px;
            line-height: 1.4;
        }

        .msg-time {
            font-size: 9px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: left;
        }

        #reaction-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 99;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #reaction-overlay.active {
            display: flex;
            animation: fadeInOverlay 0.2s ease;
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .reaction-modal {
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            transform: scale(0.8);
            animation: popModal 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            min-width: 260px;
            align-items: center;
        }

        @keyframes popModal {
            to { transform: scale(1); }
        }

        .emojis-row {
            display: flex;
            gap: 10px;
        }

        .reaction-emoji {
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .reaction-emoji:hover {
            transform: scale(1.3);
        }

        .delete-action-btn {
            width: 100%;
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .delete-action-btn:hover {
            background: #dc2626;
        }

        .message-reactions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .reaction-badge {
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 3px;
            color: var(--text-color);
        }

        #active-reply-bar {
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
            padding: 8px 15px;
            display: none;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }

        #active-reply-bar.active {
            display: flex;
        }

        .reply-bar-content {
            border-right: 3px solid #0284c7;
            padding-right: 10px;
            flex: 1;
        }

        body:not(.light-mode) .reply-bar-content {
            border-right-color: #38bdf8;
        }

        .reply-bar-title {
            color: #0284c7;
            font-weight: 700;
            font-size: 11px;
        }

        body:not(.light-mode) .reply-bar-title {
            color: #38bdf8;
        }

        .reply-bar-text {
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }

        .cancel-reply-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
        }

        .cancel-reply-btn:hover {
            color: var(--text-color);
        }

        .chat-input-area {
            padding: 12px 15px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .chat-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 25px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background 0.3s, color 0.3s;
            user-select: text;
        }

        .chat-input:focus {
            border-color: #38bdf8;
        }

        .send-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(37, 99, 235, 0.4);
            transition: transform 0.1s;
        }

        .send-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="auth-screen">
            <div class="auth-card">
                <h2>NexChat</h2>
                <p>ادخل اسمك للدخول الى المجموعة</p>
                <input type="text" id="username-input" class="auth-input" placeholder="اسمك..." maxlength="20">
                <button id="join-btn" class="auth-btn">دخول</button>
            </div>
        </div>

        <div id="profile-modal" class="custom-modal">
            <div class="modal-card">
                <h3>تغيير الاسم</h3>
                <p>أدخل اسمك الجديد للدردشة</p>
                <input type="text" id="new-username-input" class="auth-input" placeholder="الاسم الجديد..." maxlength="20">
                <div class="modal-actions">
                    <button class="modal-btn-cancel" id="cancel-profile-btn">إلغاء</button>
                    <button class="modal-btn-save" id="save-profile-btn">حفظ</button>
                </div>
            </div>
        </div>

        <div id="room-modal" class="custom-modal">
            <div class="modal-card">
                <h3>تغيير اسم المجموعة</h3>
                <p>أدخل الاسم الجديد للمجموعة</p>
                <input type="text" id="new-room-input" class="auth-input" placeholder="اسم المجموعة..." maxlength="25">
                <div class="modal-actions">
                    <button class="modal-btn-cancel" id="cancel-room-btn">إلغاء</button>
                    <button class="modal-btn-save" id="save-room-btn">حفظ</button>
                </div>
            </div>
        </div>

        <header>
            <div class="room-info" id="room-header-btn" title="انقر لتغيير اسم المجموعة">
                <div class="room-avatar">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div class="room-details">
                    <h1 id="room-title-display">المجموعة العامة</h1>
                    <span>متصل الآن</span>
                </div>
            </div>
            
            <div class="header-actions">
                <div class="user-badge" id="user-profile-badge" title="انقر لتغيير اسمك">
                    <i class="fa-solid fa-user"></i> <span id="display-name">زائر</span>
                </div>
                <button class="theme-toggle-btn" id="theme-toggle-btn" title="تبديل الوضع الداكن/النهاري">
                    <i class="fa-solid fa-moon" id="theme-icon"></i>
                </button>
            </div>
        </header>

        <div id="chat-messages"></div>

        <div id="reaction-overlay">
            <div class="reaction-modal" id="reaction-modal">
                <div class="emojis-row" id="emojis-row"></div>
                <button id="delete-message-btn" class="delete-action-btn" style="display: none;">
                    <i class="fa-solid fa-trash-can"></i> حذف الرسالة
                </button>
            </div>
        </div>

        <div id="active-reply-bar">
            <div class="reply-bar-content">
                <div class="reply-bar-title" id="reply-to-username">الرد على: فلان</div>
                <div class="reply-bar-text" id="reply-to-text">نص الرسالة...</div>
            </div>
            <button class="cancel-reply-btn" id="cancel-reply-btn">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="chat-input-area">
            <input type="text" id="message-input" class="chat-input" placeholder="اكتب رسالتك هنا...">
            <button id="send-btn" class="send-btn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

    </div>

    <!-- Firebase SDK (Modular v10) مع إعداداتك الحقيقية -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBptoaP-6TBoudpoqUqy7X0KB4VT5DrIk8",
            authDomain: "nexchat-92762.firebaseapp.com",
            projectId: "nexchat-92762",
            storageBucket: "nexchat-92762.firebasestorage.app",
            messagingSenderId: "826152377707",
            appId: "1:826152377707:web:531f596d62c2c82b0b802e",
            measurementId: "G-RGD4X41BZ6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let username = localStorage.getItem("nexchat_username") || "";
        let roomName = localStorage.getItem("nexchat_roomname") || "المجموعة العامة";
        let activeMessageId = null; 
        let activeMessageOwner = null;
        let replyingTo = null;

        const authScreen = document.getElementById("auth-screen");
        const usernameInput = document.getElementById("username-input");
        const joinBtn = document.getElementById("join-btn");
        const displayNameSpan = document.getElementById("display-name");
        
        const userProfileBadge = document.getElementById("user-profile-badge");
        const profileModal = document.getElementById("profile-modal");
        const newUsernameInput = document.getElementById("new-username-input");
        const cancelProfileBtn = document.getElementById("cancel-profile-btn");
        const saveProfileBtn = document.getElementById("save-profile-btn");

        const roomHeaderBtn = document.getElementById("room-header-btn");
        const roomTitleDisplay = document.getElementById("room-title-display");
        const roomModal = document.getElementById("room-modal");
        const newRoomInput = document.getElementById("new-room-input");
        const cancelRoomBtn = document.getElementById("cancel-room-btn");
        const saveRoomBtn = document.getElementById("save-room-btn");

        const themeToggleBtn = document.getElementById("theme-toggle-btn");
        const themeIcon = document.getElementById("theme-icon");

        const messageInput = document.getElementById("message-input");
        const sendBtn = document.getElementById("send-btn");
        const chatMessages = document.getElementById("chat-messages");
        const reactionOverlay = document.getElementById("reaction-overlay");
        const emojisRow = document.getElementById("emojis-row");
        const deleteMessageBtn = document.getElementById("delete-message-btn");
        
        const activeReplyBar = document.getElementById("active-reply-bar");
        const replyToUsername = document.getElementById("reply-to-username");
        const replyToText = document.getElementById("reply-to-text");
        const cancelReplyBtn = document.getElementById("cancel-reply-btn");

        const savedTheme = localStorage.getItem("nexchat_theme");
        if (savedTheme === "light") {
            document.body.classList.add("light-mode");
            themeIcon.className = "fa-solid fa-sun";
        }

        themeToggleBtn.addEventListener("click", () => {
            document.body.classList.toggle("light-mode");
            if (document.body.classList.contains("light-mode")) {
                localStorage.setItem("nexchat_theme", "light");
                themeIcon.className = "fa-solid fa-sun";
            } else {
                localStorage.setItem("nexchat_theme", "dark");
                themeIcon.className = "fa-solid fa-moon";
            }
        });

        roomTitleDisplay.textContent = roomName;

        if (username) {
            displayNameSpan.textContent = username;
            authScreen.style.display = "none";
        }

        joinBtn.addEventListener("click", () => {
            const name = usernameInput.value.trim();
            if (name.length < 2) {
                alert("الرجاء إدخال اسم مكون من حرفين على الأقل.");
                return;
            }
            username = name;
            localStorage.setItem("nexchat_username", username);
            displayNameSpan.textContent = username;
            authScreen.style.opacity = "0";
            setTimeout(() => { authScreen.style.display = "none"; }, 300);
        });

        userProfileBadge.addEventListener("click", () => {
            newUsernameInput.value = username;
            profileModal.classList.add("active");
            newUsernameInput.focus();
        });

        cancelProfileBtn.addEventListener("click", () => {
            profileModal.classList.remove("active");
        });

        saveProfileBtn.addEventListener("click", () => {
            const newName = newUsernameInput.value.trim();
            if (newName.length < 2) {
                alert("الرجاء إدخال اسم مكون من حرفين على الأقل.");
                return;
            }
            username = newName;
            localStorage.setItem("nexchat_username", username);
            displayNameSpan.textContent = username;
            profileModal.classList.remove("active");
        });

        roomHeaderBtn.addEventListener("click", () => {
            newRoomInput.value = roomName;
            roomModal.classList.add("active");
            newRoomInput.focus();
        });

        cancelRoomBtn.addEventListener("click", () => {
            roomModal.classList.remove("active");
        });

        saveRoomBtn.addEventListener("click", () => {
            const newRName = newRoomInput.value.trim();
            if (newRName.length < 2) {
                alert("الرجاء إدخال اسم مجموعة مكون من حرفين على الأقل.");
                return;
            }
            roomName = newRName;
            localStorage.setItem("nexchat_roomname", roomName);
            roomTitleDisplay.textContent = roomName;
            roomModal.classList.remove("active");
        });

        const emojis = ['👍🏻', '🙂', '❤', '😭', '😂', '😓', '😍', '🤮'];

        emojis.forEach(emoji => {
            const span = document.createElement("span");
            span.className = "reaction-emoji";
            span.textContent = emoji;
            
            span.addEventListener('click', async () => {
                if (!activeMessageId) return;
                reactionOverlay.classList.remove('active');
                
                try {
                    const messageRef = doc(db, "public_room", activeMessageId);
                    const currentDoc = await getDoc(messageRef);
                    if (currentDoc.exists()) {
                        const currentReactions = currentDoc.data().reactions || {};
                        currentReactions[username] = emoji;
                        await updateDoc(messageRef, { reactions: currentReactions });
                    }
                } catch (err) {
                    console.error("خطأ في تحديث التفاعل: ", err);
                }
                activeMessageId = null;
            });
            emojisRow.appendChild(span);
        });

        deleteMessageBtn.addEventListener('click', async () => {
            if (!activeMessageId) return;
            
            if (activeMessageOwner !== username) {
                alert("لا يمكنك حذف رسالة شخص آخر!");
                return;
            }

            reactionOverlay.classList.remove('active');

            try {
                const messageRef = doc(db, "public_room", activeMessageId);
                await deleteDoc(messageRef);
            } catch (err) {
                console.error("خطأ في حذف الرسالة: ", err);
                alert("تعذر حذف الرسالة.");
            }
            activeMessageId = null;
            activeMessageOwner = null;
        });

        reactionOverlay.addEventListener('click', (e) => {
            if (e.target === reactionOverlay) {
                reactionOverlay.classList.remove('active');
                activeMessageId = null;
                activeMessageOwner = null;
            }
        });

        cancelReplyBtn.addEventListener('click', () => {
            replyingTo = null;
            activeReplyBar.classList.remove('active');
        });

        sendBtn.addEventListener("click", sendMessage);
        messageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !username) return;

            try {
                messageInput.value = "";
                
                const replyData = replyingTo ? {
                    replyToUser: replyingTo.username,
                    replyToText: replyingTo.text
                } : null;

                replyingTo = null;
                activeReplyBar.classList.remove('active');

                await addDoc(collection(db, "public_room"), {
                    username: username,
                    text: text,
                    timestamp: serverTimestamp(),
                    reactions: {},
                    reply: replyData
                });
            } catch (error) {
                console.error("خطأ في إرسال الرسالة: ", error);
                alert("تعذر إرسال الرسالة.");
            }
        }

        const q = query(collection(db, "public_room"), orderBy("timestamp", "asc"));
        
        onSnapshot(q, (snapshot) => {
            chatMessages.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                const isMe = data.username === username;
                
                const containerDiv = document.createElement("div");
                containerDiv.className = `message-container ${isMe ? 'outgoing' : 'incoming'}`;
                
                let timeString = "";
                if (data.timestamp) {
                    const date = data.timestamp.toDate();
                    timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }

                let replyHtml = '';
                if (data.reply) {
                    replyHtml = `
                        <div class="reply-preview-box">
                            <div class="reply-preview-sender">${escapeHtml(data.reply.replyToUser)}</div>
                            <div class="reply-preview-text" style="font-size: 11px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(data.reply.replyToText)}</div>
                        </div>
                    `;
                }

                let badgesHtml = '';
                if (data.reactions) {
                    const counts = {};
                    Object.values(data.reactions).forEach(emj => {
                        counts[emj] = (counts[emj] || 0) + 1;
                    });
                    for (const [emj, count] of Object.entries(counts)) {
                        badgesHtml += `<div class="reaction-badge">${emj} <span>${count}</span></div>`;
                    }
                }

                containerDiv.innerHTML = `
                    <div class="msg-sender">${escapeHtml(data.username)}</div>
                    <div class="message-bubble" id="bubble-${docId}">
                        ${replyHtml}
                        <div class="msg-text">${escapeHtml(data.text)}</div>
                        <div class="msg-time">${timeString}</div>
                    </div>
                    <div class="message-reactions">
                        ${badgesHtml}
                    </div>
                `;
                
                chatMessages.appendChild(containerDiv);

                const bubble = containerDiv.querySelector(`#bubble-${docId}`);

                let pressTimer = null;
                const startLongPress = () => {
                    pressTimer = setTimeout(() => {
                        activeMessageId = docId;
                        activeMessageOwner = data.username;
                        
                        if (data.username === username) {
                            deleteMessageBtn.style.display = "flex";
                        } else {
                            deleteMessageBtn.style.display = "none";
                        }

                        reactionOverlay.classList.add('active');
                    }, 500);
                };
                const cancelLongPress = () => {
                    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
                };

                bubble.addEventListener('touchstart', startLongPress);
                bubble.addEventListener('touchend', cancelLongPress);
                bubble.addEventListener('touchmove', cancelLongPress);
                bubble.addEventListener('mousedown', startLongPress);
                bubble.addEventListener('mouseup', cancelLongPress);
                bubble.addEventListener('mouseleave', cancelLongPress);
                bubble.addEventListener('contextmenu', (e) => e.preventDefault());

                let startX = 0;
                let currentX = 0;
                let isSwiping = false;

                bubble.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    isSwiping = true;
                }, {passive: true});

                bubble.addEventListener('touchmove', (e) => {
                    if (!isSwiping) return;
                    currentX = e.touches[0].clientX;
                    let diff = currentX - startX;
                    
                    if (Math.abs(diff) < 70) {
                        containerDiv.style.transform = `translateX(${diff}px)`;
                    }
                }, {passive: true});

                bubble.addEventListener('touchend', (e) => {
                    if (!isSwiping) return;
                    isSwiping = false;
                    let diff = currentX - startX;
                    containerDiv.style.transform = `translateX(0px)`;

                    if (Math.abs(diff) > 40) {
                        replyingTo = { username: data.username, text: data.text };
                        replyToUsername.textContent = `الرد على: ${data.username}`;
                        replyToText.textContent = data.text;
                        activeReplyBar.classList.add('active');
                        messageInput.focus();
                    }
                });

                bubble.addEventListener('mousedown', (e) => {
                    startX = e.clientX;
                    isSwiping = true;
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isSwiping) return;
                    currentX = e.clientX;
                    let diff = currentX - startX;
                    if (Math.abs(diff) < 70) {
                        containerDiv.style.transform = `translateX(${diff}px)`;
                    }
                });

                window.addEventListener('mouseup', (e) => {
                    if (!isSwiping) return;
                    isSwiping, isSwiping = false;
                    let diff = currentX - startX;
                    containerDiv.style.transform = `translateX(0px)`;
                    if (Math.abs(diff) > 40) {
                        replyingTo = { username: data.username, text: data.text };
                        replyToUsername.textContent = `الرد على: ${data.username}`;
                        replyToText.textContent = data.text;
                        activeReplyBar.classList.add('active');
                        messageInput.focus();
                    }
                });
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
